version: "3.9"

services:
  control-plane:
    image: hive/control-plane:ci
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/hive?sslmode=disable
      # Integration suite logs in once per test; keep the auth limiter from
      # tripping on the test run.
      - AUTH_RATE_LIMIT_PER_MIN=10000
      - WEBHOOK_RATE_LIMIT_PER_MIN=10000
      # BuildKit runs as a privileged host-level container seeded by the CI
      # prereqs script under a CI-specific DNS alias.
      - BUILDKIT_ADDR=tcp://buildkit-ci:1234
      - MASTER_KEY_FILE=/run/secrets/hive-master-key
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AGENT_BOOTSTRAP_TOKEN=ci-bootstrap-token
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.ci == true
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host

  agent:
    image: hive/agent:ci
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.ci == true

  traefik:
    deploy:
      mode: replicated
      replicas: 0

  postgres:
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host
    deploy:
      placement:
        constraints:
          - node.labels.ci == true

  pgbouncer:
    ports:
      - target: 6432
        published: 6432
        protocol: tcp
        mode: host

  registry:
    deploy:
      placement:
        constraints:
          - node.labels.ci == true

secrets:
  hive-master-key:
    external: true
  postgres-password:
    external: true
  agent-bootstrap-token:
    external: true
