version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks: [hive_internal]

  grafana:
    image: grafana/grafana:latest
    networks: [hive_internal, hive_proxy]
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.grafana.rule=Host(`grafana.${HIVE_DOMAIN}`)
        - traefik.http.routers.grafana.entrypoints=websecure
        - traefik.http.routers.grafana.tls.certresolver=letsencrypt

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    deploy:
      mode: global
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [hive_internal]

networks:
  hive_internal:
    external: true
  hive_proxy:
    external: true
