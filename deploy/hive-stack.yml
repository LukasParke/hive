version: "3.9"

services:
  control-plane:
    image: ${HIVE_CONTROL_PLANE_IMAGE:-ghcr.io/lukasparke/hive/control-plane}:${HIVE_IMAGE_TAG:-latest}
    command: ["/control-plane"]
    environment:
      - DATABASE_URL=postgres://postgres@postgres:5432/hive?sslmode=disable
      - DATABASE_PASSWORD_FILE=/run/secrets/postgres-password
      - MASTER_KEY_FILE=/run/secrets/hive-master-key
      - JWT_SECRET_FILE=/run/secrets/hive-jwt-secret
      - AGENT_BOOTSTRAP_TOKEN_FILE=/run/secrets/agent-bootstrap-token
      - DOCKER_HOST=unix:///var/run/docker.sock
    deploy:
      mode: replicated
      replicas: 3
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - hive.service=control-plane
        # Disabled by default for no-domain installs; hivectl/init.sh enable it
        # when HIVE_DOMAIN is configured to avoid ACME attempts for localhost.
        - traefik.enable=${HIVE_TRAEFIK_ENABLE:-false}
        - traefik.http.routers.hive.rule=Host(`${HIVE_DOMAIN:-localhost}`)
        - traefik.http.routers.hive.entrypoints=websecure
        - traefik.http.routers.hive.tls.certresolver=letsencrypt
        - traefik.http.routers.hive.service=hive
        - traefik.http.routers.hive.priority=100
        - traefik.http.services.hive.loadbalancer.server.port=3000
        - traefik.http.services.hive.loadbalancer.sticky.cookie.name=hive_sticky
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [hive_internal, hive_proxy]
    ports:
      # Direct no-domain/LAN/Cloudflare access bypasses Traefik so it cannot
      # fail with a Traefik 404 when no hostname router is configured.
      - target: 3000
        published: ${HIVE_DIRECT_PORT:-8080}
        protocol: tcp
      # Keep the raw control-plane port as an explicit API fallback.
      - target: 3000
        published: ${HIVE_CONTROL_PLANE_PORT:-3000}
        protocol: tcp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - shared:/data/shared
    tmpfs:
      - /data/local:size=2g
    secrets:
      - hive-master-key
      - postgres-password
      - hive-jwt-secret
      - agent-bootstrap-token

  agent:
    image: ${HIVE_AGENT_IMAGE:-ghcr.io/lukasparke/hive/agent}:${HIVE_IMAGE_TAG:-latest}
    deploy:
      mode: global
      labels:
        - hive.service=agent
    # No published ports. The control-plane reaches the agent RPC (9090) over
    # the encrypted hive_internal overlay by its per-node task IP, and the
    # container healthcheck hits 9091 on localhost — neither needs LAN exposure.
    networks: [hive_internal]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
      - /var/run/dbus:/var/run/dbus:ro
      - agent-certs:/data/agent/certs
    environment:
      - HOST_ROOT=/host
      - HOST_MGMT_ENABLED=${HIVE_HOST_MGMT:-false}
      - CONTROL_PLANE_URL=http://control-plane:3000
    secrets:
      - agent-bootstrap-token
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  traefik:
    image: traefik:v3.6
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=hive_proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.invalid}
      - --certificatesresolvers.letsencrypt.acme.storage=/data/shared/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: stop-first
        failure_action: rollback
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - shared:/data/shared
    networks: [hive_proxy]

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=hive
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres-password
    deploy:
      placement:
        constraints:
          - node.labels.db == true
    # No published ports: Postgres is reachable only over the hive_internal
    # overlay. Use deploy/hive-stack.ci.yml (or your own override) to expose it.
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - postgres-password
    networks: [hive_internal]

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DB_USER=postgres
      - DB_PASSWORD_FILE=/run/secrets/postgres-password
      - DB_HOST=postgres
      - DB_NAME=hive
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=20
    secrets:
      - postgres-password
    # Internal-only; see postgres above.
    networks: [hive_internal]

  buildkit:
    image: moby/buildkit:latest
    command: ["buildkitd", "--addr", "tcp://0.0.0.0:1234"]
    deploy:
      placement:
        constraints:
          - node.labels.builder == true
    # No published ports: BuildKit has no authentication, so it must never be
    # reachable off the hive_internal overlay. The control-plane reaches it via
    # BUILDKIT_ADDR=tcp://buildkit:1234.
    networks: [hive_internal]
    volumes:
      - buildkit-cache:/var/lib/buildkit

  registry:
    image: registry:2
    deploy:
      placement:
        constraints:
          - node.labels.registry == true
    # No published ports: the registry runs without auth/TLS, so it stays on the
    # hive_internal overlay only. The control-plane reaches it via
    # REGISTRY_ADDR=registry:5000.
    networks: [hive_internal]
    volumes:
      - registry-data:/var/lib/registry

# Networks are created by hivectl (or CI) ahead of deploy so their names are
# stable regardless of the stack name. Traefik's swarm provider and the
# control-plane's database provisioning both reference them by exact name.
networks:
  hive_internal:
    external: true
  hive_proxy:
    external: true

volumes:
  pgdata: {}
  shared: {}
  buildkit-cache: {}
  registry-data: {}
  agent-certs: {}

secrets:
  hive-master-key:
    external: true
  postgres-password:
    external: true
  hive-jwt-secret:
    external: true
  agent-bootstrap-token:
    external: true
