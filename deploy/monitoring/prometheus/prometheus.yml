global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # cAdvisor runs global (one task per node); DNS-based discovery re-resolves
  # tasks.cadvisor on every refresh so node churn is picked up.
  - job_name: cadvisor
    dns_sd_configs:
      - names:
          - tasks.cadvisor
        type: A
        port: 8080
        refresh_interval: 15s

  # Agent metrics + health server (always plaintext, separate from the RPC
  # port): see AGENT_METRICS_ADDR in agent/cmd/agent/main.go.
  - job_name: agent
    dns_sd_configs:
      - names:
          - tasks.agent
        type: A
        port: 9091
        refresh_interval: 15s

  - job_name: control-plane
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - tasks.control-plane
        type: A
        port: 3000
        refresh_interval: 15s
