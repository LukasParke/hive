name: Go Build and Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -vE "internal/testdb|internal/db/generated|cmd/")
      - name: Enforce coverage floor (95% on internal packages)
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%",""); print $3}')
          floor=95
          # ratchet: raise as coverage grows. internal/testdb is a test
          # harness (container bootstrap paths) and is excluded from scope.
          awk -v p="$pct" -v t="$floor" 'BEGIN { if (p+0 < t) { printf "coverage %.2f%% is below floor %d%%\n", p, t; exit 1 } }'
      - uses: actions/upload-artifact@v4
        with:
          name: control-plane-coverage
          path: control-plane/coverage.out
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test -race -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v internal/testdb)
      - name: Enforce coverage floor (95% on internal packages)
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%",""); print $3}')
          floor=95
          # ratchet: raise as coverage grows. internal/testdb is a test
          # harness (container bootstrap paths) and is excluded from scope.
          awk -v p="$pct" -v t="$floor" 'BEGIN { if (p+0 < t) { printf "coverage %.2f%% is below floor %d%%\n", p, t; exit 1 } }'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: golangci-lint control-plane
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: control-plane
          args: --timeout=5m
      - name: golangci-lint agent
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: agent
          args: --timeout=5m
  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: bufbuild/buf-setup-action@v1
      - name: Regenerate protos
        run: cd proto && buf generate
      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain proto/gen/)" ]; then
            echo "Proto generated code is out of date. Run 'make proto' and commit."
            git diff proto/gen/
            exit 1
          fi
