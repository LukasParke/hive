name: Nightly Release

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'  # 02:17 UTC nightly (offset to avoid herd traffic)

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  CP_IMAGE: ghcr.io/luke/hive/control-plane
  AGENT_IMAGE: ghcr.io/luke/hive/agent

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      nightly_tag: ${{ steps.version.outputs.nightly_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          DATE=$(date -u +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=nightly-${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "nightly_tag=nightly" >> "$GITHUB_OUTPUT"

  images:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push control-plane
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./control-plane/Dockerfile
          push: true
          tags: |
            ${{ env.CP_IMAGE }}:${{ needs.version.outputs.tag }}
            ${{ env.CP_IMAGE }}:${{ needs.version.outputs.nightly_tag }}
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=cp-release
          cache-to: type=gha,mode=max,scope=cp-release

      - name: Build and push agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./agent/Dockerfile
          push: true
          tags: |
            ${{ env.AGENT_IMAGE }}:${{ needs.version.outputs.tag }}
            ${{ env.AGENT_IMAGE }}:${{ needs.version.outputs.nightly_tag }}
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=agent-release
          cache-to: type=gha,mode=max,scope=agent-release

  release:
    runs-on: ubuntu-latest
    needs: [version, images]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          echo "## Changes since last nightly" > /tmp/changelog.md
          echo "" >> /tmp/changelog.md
          git log --pretty=format:'- %s (%h)' --no-merges -20 >> /tmp/changelog.md || true
          echo "" >> /tmp/changelog.md
          echo "## Images" >> /tmp/changelog.md
          echo "- \`${{ env.CP_IMAGE }}:${TAG}\`" >> /tmp/changelog.md
          echo "- \`${{ env.AGENT_IMAGE }}:${TAG}\`" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
          echo "**Note:** This is an automated nightly release for testing." >> /tmp/changelog.md

      - name: Create or update nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: "Nightly (${{ needs.version.outputs.tag }})"
          bodyFile: /tmp/changelog.md
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          makeLatest: false
          prerelease: true
