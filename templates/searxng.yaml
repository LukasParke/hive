kind: Template
name: searxng
description: SearXNG is a privacy-respecting, hackable metasearch engine that aggregates results from various search engines without tracking users.
category: security
tags:
    - search-engine
    - metasearch
    - privacy
    - self-hosted
    - aggregator
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/searxng.svg
version: latest
links:
    docs: https://docs.searxng.github.io/
    github: https://github.com/searxng/searxng
    website: https://searxng.github.io/
image: searxng/searxng:latest
stack: true
services:
    - name: searxng
      image: searxng/searxng:latest
      volumes:
        - searxng-data:/var/cache/searxng
    - name: valkey
      image: valkey/valkey:8-alpine
      volumes:
        - valkey-data:/data
      command: valkey-server --save 30 1 --loglevel warning
