kind: Template
name: formbricks
description: Formbricks is an open-source survey and form platform for collecting user data.
category: productivity
tags:
    - forms
    - analytics
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/formbricks.svg
version: v3.1.3
links:
    docs: https://formbricks.com/docs
    github: https://github.com/formbricks/formbricks
    website: https://formbricks.com/
image: ghcr.io/formbricks/formbricks:v3.1.5
ports:
    - "3000"
stack: true
services:
    - name: formbricks
      image: ghcr.io/formbricks/formbricks:v3.1.5
      ports:
        - "3000"
      env:
        CRON_SECRET: ""
        DATABASE_URL: postgresql://postgres:postgres@postgres:5432/formbricks?schema=public
        EMAIL_VERIFICATION_DISABLED: "1"
        ENCRYPTION_KEY: ""
        NEXTAUTH_SECRET: ""
        NEXTAUTH_URL: ""
        PASSWORD_RESET_DISABLED: "1"
        S3_FORCE_PATH_STYLE: "0"
        WEBAPP_URL: ""
    - name: postgres
      image: pgvector/pgvector:pg17
      env:
        POSTGRES_PASSWORD: postgres
      volumes:
        - postgres:/var/lib/postgresql/data
