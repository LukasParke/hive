kind: Template
name: netdata
description: Netdata is a real-time performance monitoring tool that provides comprehensive system metrics, application monitoring, and infrastructure health insights.
category: monitoring
tags:
    - monitoring
    - metrics
    - analytics
    - performance
    - infrastructure
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/netdata.svg
version: latest
links:
    docs: https://learn.netdata.cloud/
    github: https://github.com/netdata/netdata
    website: https://www.netdata.cloud/
image: netdata/netdata:latest
ports:
    - "19999"
volumes:
    - netdata-config:/etc/netdata
    - netdata-lib:/var/lib/netdata
    - netdata-cache:/var/cache/netdata
    - /etc/passwd:/host/etc/passwd:ro
    - /etc/group:/host/etc/group:ro
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /etc/os-release:/host/etc/os-release:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
env:
    NETDATA_CLAIM_ROOMS: ""
    NETDATA_CLAIM_TOKEN: ""
    NETDATA_CLAIM_URL: ""
