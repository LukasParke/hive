kind: Template
name: huly
description: Huly — All-in-One Project Management Platform (alternative to Linear, Jira, Slack, Notion, Motion)
category: productivity
tags:
    - project-management
    - community
    - discussion
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/huly.svg
version: 0.6.377
links:
    docs: https://docs.huly.io/
    github: https://github.com/hcengineering/huly-selfhost
    website: https://huly.io/
image: nginx:1.21.3
ports:
    - "80"
stack: true
services:
    - name: account
      image: 'hardcoreeng/account:'
      env:
        ACCOUNT_PORT: "3000"
        ACCOUNTS_URL: http://localhost:3000
        DB_URL: mongodb://mongodb:27017
        FRONT_URL: http://front:8080
        MODEL_ENABLED: '*'
        MONGO_URL: mongodb://mongodb:27017
        SERVER_PORT: "3000"
        SERVER_SECRET: ""
        STATS_URL: http://stats:4900
        STORAGE_CONFIG: minio|minio?accessKey=minioadmin&secretKey=minioadmin
        TRANSACTOR_URL: ws://transactor:3333;ws:///_transactor
    - name: collaborator
      image: 'hardcoreeng/collaborator:'
      env:
        ACCOUNTS_URL: http://account:3000
        COLLABORATOR_PORT: "3078"
        DB_URL: mongodb://mongodb:27017
        SECRET: ""
        STATS_URL: http://stats:4900
        STORAGE_CONFIG: minio|minio?accessKey=minioadmin&secretKey=minioadmin
    - name: elastic
      image: elasticsearch:7.14.2
      env:
        BITNAMI_DEBUG: "true"
        ELASTICSEARCH_PORT_NUMBER: "9200"
        ES_JAVA_OPTS: -Xms1024m -Xmx1024m
        discovery.type: single-node
        http.cors.allow-origin: http://localhost:8082
        http.cors.enabled: "true"
      volumes:
        - elastic:/usr/share/elasticsearch/data
      command: |
        /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
        /usr/local/bin/docker-entrypoint.sh eswrapper"
    - name: front
      image: 'hardcoreeng/front:'
      env:
        ACCOUNTS_URL: http:///_accounts
        CALENDAR_URL: http:///_calendar
        COLLABORATOR_URL: ws:///_collaborator
        DB_URL: mongodb://mongodb:27017
        DEFAULT_LANGUAGE: en
        DESKTOP_UPDATES_CHANNEL: selfhost
        ELASTIC_URL: http://elastic:9200
        GMAIL_URL: http:///_gmail
        LAST_NAME_FIRST: "true"
        LOVE_ENDPOINT: http:///_love
        MONGO_URL: mongodb://mongodb:27017
        REKONI_URL: http:///_rekoni
        SERVER_PORT: "8080"
        SERVER_SECRET: ""
        STATS_URL: http:///_stats
        STORAGE_CONFIG: minio|minio?accessKey=minioadmin&secretKey=minioadmin
        TELEGRAM_URL: http:///_telegram
        TITLE: Huly Self Host
        UPLOAD_URL: /files
    - name: fulltext
      image: 'hardcoreeng/fulltext:'
      env:
        ACCOUNTS_URL: http://account:3000
        DB_URL: mongodb://mongodb:27017
        ELASTIC_INDEX_NAME: huly_storage_index
        FULLTEXT_DB_URL: http://elastic:9200
        REKONI_URL: http://rekoni:4004
        SERVER_SECRET: ""
        STATS_URL: http://stats:4900
        STORAGE_CONFIG: minio|minio?accessKey=minioadmin&secretKey=minioadmin
    - name: minio
      image: minio/minio:RELEASE.2024-11-07T00-52-20Z
      volumes:
        - files:/data
      command: server /data --address ":9000" --console-address ":9001"
    - name: mongodb
      image: mongo:7-jammy
      env:
        PGID: "1000"
        PUID: "1000"
      volumes:
        - db:/data/db
    - name: nginx
      image: nginx:1.21.3
      ports:
        - "80"
    - name: rekoni
      image: 'hardcoreeng/rekoni-service:'
      env:
        SECRET: ""
    - name: stats
      image: 'hardcoreeng/stats:'
      env:
        PORT: "4900"
        SERVER_SECRET: ""
    - name: transactor
      image: 'hardcoreeng/transactor:'
      env:
        ACCOUNTS_URL: http://account:3000
        DB_URL: mongodb://mongodb:27017
        FRONT_URL: http://localhost:8087
        FULLTEXT_URL: http://fulltext:4700
        LAST_NAME_FIRST: "true"
        MONGO_URL: mongodb://mongodb:27017
        SERVER_CURSOR_MAXTIMEMS: "30000"
        SERVER_PORT: "3333"
        SERVER_SECRET: ""
        STATS_URL: http://stats:4900
        STORAGE_CONFIG: minio|minio?accessKey=minioadmin&secretKey=minioadmin
    - name: workspace
      image: 'hardcoreeng/workspace:'
      env:
        ACCOUNTS_URL: http://account:3000
        DB_URL: mongodb://mongodb:27017
        MODEL_ENABLED: '*'
        MONGO_URL: mongodb://mongodb:27017
        SERVER_SECRET: ""
        STATS_URL: http://stats:4900
        STORAGE_CONFIG: minio|minio?accessKey=minioadmin&secretKey=minioadmin
        TRANSACTOR_URL: ws://transactor:3333;ws:///_transactor
