kind: Template
name: paymenter
description: Paymenter is a modern billing and payment management system for hosting providers, with automation, invoicing, and client management features.
category: hosting
tags:
    - billing
    - payment
    - hosting
    - invoicing
    - business
    - automation
    - client-management
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/paymenter.svg
version: latest
links:
    docs: https://paymenter.org/docs/
    github: https://github.com/Paymenter/Paymenter
    website: https://paymenter.org/
image: ghcr.io/paymenter/paymenter:latest
ports:
    - "80"
stack: true
services:
    - name: cache
      image: redis:alpine
      volumes:
        - paymenter-redis:/data
    - name: database
      image: mariadb:lts
      env:
        MYSQL_DATABASE: paymenter
        MYSQL_PASSWORD: ""
        MYSQL_ROOT_PASSWORD: ""
        MYSQL_USER: paymenter
      volumes:
        - paymenter-database:/var/lib/mysql
      command: --default-authentication-plugin=mysql_native_password
    - name: paymenter
      image: ghcr.io/paymenter/paymenter:latest
      ports:
        - "80"
      env:
        APP_DEBUG: "false"
        APP_ENV: production
        APP_KEY: ""
        APP_URL: ""
        CACHE_STORE: redis
        DB_CONNECTION: mysql
        DB_DATABASE: paymenter
        DB_HOST: database
        DB_PASSWORD: ""
        DB_PORT: "3306"
        DB_USERNAME: paymenter
        REDIS_HOST: cache
        REDIS_PORT: "6379"
        TRUSTED_PROXIES: '*'
      volumes:
        - paymenter-storage:/app/var
        - paymenter-logs:/app/storage/logs
        - paymenter-public:/app/storage/app/public
