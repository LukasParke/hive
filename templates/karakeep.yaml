kind: Template
name: karakeep
description: A self-hostable bookmark-everything app (links, notes and images) with AI-based automatic tagging and full text search. Previously known as Hoarder.
category: productivity
tags:
    - bookmarks
    - bookmark-manager
    - self-hosted
    - ai
    - search
    - notes
    - productivity
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/karakeep.svg
version: 0.25.0
links:
    docs: https://github.com/karakeep-app/karakeep/tree/main/docs
    github: https://github.com/karakeep-app/karakeep
    website: https://karakeep.app/
image: gcr.io/zenika-hub/alpine-chrome:124
stack: true
services:
    - name: chrome
      image: gcr.io/zenika-hub/alpine-chrome:124
      command:
        - --no-sandbox
        - --disable-gpu
        - --disable-dev-shm-usage
        - --remote-debugging-address=0.0.0.0
        - --remote-debugging-port=9222
        - --hide-scrollbars
    - name: meilisearch
      image: getmeili/meilisearch:v1.13.3
      env:
        MEILI_NO_ANALYTICS: "true"
      volumes:
        - meilisearch:/meili_data
    - name: web
      image: ghcr.io/karakeep-app/karakeep:release
      env:
        BROWSER_WEB_URL: http://chrome:9222
        DATA_DIR: /data
        MEILI_ADDR: http://meilisearch:7700
        NEXTAUTH_SECRET: your_secure_key
      volumes:
        - data:/data
