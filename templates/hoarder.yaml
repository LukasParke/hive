kind: Template
name: hoarder
description: Hoarder is an open source "Bookmark Everything" app that uses AI for automatically tagging the content you throw at it.
category: productivity
tags:
    - self-hosted
    - bookmarks
    - link-sharing
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/hoarder.svg
version: 0.22.0
links:
    docs: https://docs.hoarder.app/
    github: https://github.com/hoarder/hoarder
    website: https://hoarder.app/
image: ghcr.io/hoarder-app/hoarder:0.22.0
ports:
    - "3000"
stack: true
services:
    - name: chrome
      image: gcr.io/zenika-hub/alpine-chrome:124
      command:
        - --no-sandbox
        - --disable-gpu
        - --disable-dev-shm-usage
        - --remote-debugging-address=0.0.0.0
        - --remote-debugging-port=9222
        - --hide-scrollbars
    - name: meilisearch
      image: getmeili/meilisearch:v1.6
      env:
        MEILI_NO_ANALYTICS: "true"
      volumes:
        - meilisearch-data:/meili_data
    - name: web
      image: ghcr.io/hoarder-app/hoarder:0.22.0
      ports:
        - "3000"
      env:
        BROWSER_WEB_URL: http://chrome:9222
        DATA_DIR: /data
        MEILI_ADDR: http://meilisearch:7700
      volumes:
        - hoarder-data:/data
