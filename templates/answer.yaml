kind: Template
name: answer
description: Answer is an open-source Q&A platform for building a self-hosted question-and-answer service.
category: q&a
tags:
    - q&a
    - self-hosted
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/answer.svg
version: v1.4.1
links:
    docs: https://answer.apache.org/docs
    github: https://github.com/apache/answer
    website: https://answer.apache.org/
image: apache/answer:1.4.1
ports:
    - "80"
stack: true
services:
    - name: answer
      image: apache/answer:1.4.1
      ports:
        - "80"
      volumes:
        - answer-data:/data
    - name: db
      image: postgres:16
      env:
        POSTGRES_DB: answer
        POSTGRES_PASSWORD: postgres
        POSTGRES_USER: postgres
      volumes:
        - db-data:/var/lib/postgresql/data
