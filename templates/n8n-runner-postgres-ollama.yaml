kind: Template
name: n8n-runner-postgres-ollama
description: n8n is an open source low-code platform for automating workflows and integrations with PostgreSQL database and Ollama AI model.
category: automation
tags:
    - ai
    - automation
    - workflow
    - low-code
    - postgres
    - ollama
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/n8n-+-worker-+-runner-with-redis/postgres-and-ollama.svg
version: latest
links:
    docs: https://docs.n8n.io/
    github: https://github.com/n8n-io/n8n
    website: https://n8n.io/
image: ollama/ollama:latest
stack: true
services:
    - name: init-ollama
      image: ollama/ollama:latest
      env:
        OLLAMA_HOST: ollama:11434
      volumes:
        - ollama_storage:/home/node/.ollama
      command:
        - -c
        - sleep 3; ollama pull llama3.2:latest; ollama pull gemma3:latest
    - name: n8n
      image: n8nio/n8n:latest
      env:
        DB_POSTGRESDB_HOST: postgres
        DB_POSTGRESDB_PASSWORD: ""
        DB_POSTGRESDB_USER: ""
        DB_TYPE: postgresdb
        EXECUTIONS_DATA_MAX_AGE: "7"
        EXECUTIONS_DATA_PRUNE: "true"
        EXECUTIONS_MODE: queue
        GENERIC_TIMEZONE: ""
        N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
        N8N_DIAGNOSTICS_ENABLED: "false"
        N8N_ENCRYPTION_KEY: ""
        N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
        N8N_HIRING_BANNER_ENABLED: "false"
        N8N_HOST: ""
        N8N_NATIVE_PYTHON_RUNNER: "true"
        N8N_PERSONALIZATION_ENABLED: "true"
        N8N_PORT: ""
        N8N_PROTOCOL: https
        N8N_PROXY_HOPS: "1"
        N8N_RUNNERS_AUTH_TOKEN: ""
        N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
        N8N_RUNNERS_ENABLED: "true"
        N8N_RUNNERS_MAX_CONCURRENCY: "50"
        N8N_RUNNERS_MODE: external
        N8N_SECURE_COOKIE: "true"
        N8N_TEMPLATES_ENABLED: "true"
        NODE_ENV: production
        OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
        OLLAMA_HOST: ollama:11434
        QUEUE_BULL_REDIS_HOST: redis
        QUEUE_BULL_REDIS_PORT: "6379"
        WEBHOOK_URL: https:///
      volumes:
        - n8n_data:/home/node/.n8n
    - name: n8n-runner
      image: n8nio/runners:nightly
      env:
        GENERIC_TIMEZONE: ""
        N8N_ENCRYPTION_KEY: ""
        N8N_RUNNERS_AUTH_TOKEN: ""
        N8N_RUNNERS_MAX_CONCURRENCY: "50"
        N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
    - name: n8n-worker
      image: docker.n8n.io/n8nio/n8n:latest
      env:
        DB_POSTGRESDB_HOST: postgres
        DB_POSTGRESDB_PASSWORD: ""
        DB_POSTGRESDB_USER: ""
        DB_TYPE: postgresdb
        EXECUTIONS_MODE: queue
        GENERIC_TIMEZONE: ""
        N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
        N8N_ENCRYPTION_KEY: ""
        N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
        N8N_HOST: ""
        N8N_PORT: ""
        N8N_PROTOCOL: https
        N8N_PROXY_HOPS: ""
        N8N_SECURE_COOKIE: "true"
        NODE_ENV: production
        QUEUE_BULL_REDIS_HOST: redis
        QUEUE_BULL_REDIS_PORT: "6379"
        WEBHOOK_URL: https:///
      command: worker
    - name: ollama
      image: ollama/ollama:latest
      volumes:
        - ollama_storage:/home/node/.ollama
    - name: postgres
      image: postgres:17-alpine
      env:
        POSTGRES_DB: ""
        POSTGRES_PASSWORD: ""
        POSTGRES_USER: ""
      volumes:
        - postgres_storage:/var/lib/postgresql/data
    - name: redis
      image: redis:7-alpine
      volumes:
        - redis_storage:/data
      command: redis-server --appendonly yes
