kind: Template
name: cloud9
description: Cloud9 is a cloud-based integrated development environment (IDE) designed for developers to code, build, and debug applications collaboratively in real time.
category: development
tags:
    - ide
    - development
    - cloud
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/cloud9.svg
version: 1.29.2
links:
    docs: https://docs.aws.amazon.com/cloud9/
    github: https://github.com/c9
    website: https://aws.amazon.com/cloud9/
image: lscr.io/linuxserver/cloud9:1.29.2
ports:
    - "8000"
volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - code:/code
env:
    GITURL: https://github.com/linuxserver/docker-cloud9.git
    PASSWORD: ""
    PGID: "1000"
    PUID: "1000"
    TZ: Europe/London
    USERNAME: ""
