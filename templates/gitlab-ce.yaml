kind: Template
name: gitlab-ce
description: GitLab Community Edition is a free and open source platform for managing Git repositories, CI/CD pipelines, and project management.
category: development
tags:
    - git
    - ci-cd
    - version-control
    - project-management
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/gitlab-ce.svg
version: latest
links:
    docs: https://docs.gitlab.com/ee/
    github: https://gitlab.com/gitlab-org/gitlab-ce
    website: https://gitlab.com/
image: gitlab/gitlab-ce:latest
ports:
    - "80"
    - "2224"
stack: true
services:
    - name: gitlab
      image: gitlab/gitlab-ce:latest
      ports:
        - "80"
        - "2224"
      env:
        GITLAB_OMNIBUS_CONFIG: |
            external_url 'http://'
            gitlab_rails['gitlab_ssh_host'] = ''
            gitlab_rails['gitlab_shell_ssh_port'] = 2224
            gitlab_rails['db_adapter'] = 'postgresql'
            gitlab_rails['db_host'] = 'postgresql'
            gitlab_rails['db_port'] = '5432'
            gitlab_rails['db_database'] = ''
            gitlab_rails['db_username'] = ''
            gitlab_rails['db_password'] = ''
            # Redis config for external TCP connection
            gitlab_rails['redis_url'] = 'redis://redis:6379/0'
            gitlab_rails['redis_host'] = 'redis'
            gitlab_rails['redis_port'] = 6379
            gitlab_rails['redis_socket'] = nil
            gitlab_rails['gitlab_email_enabled'] = false
            gitlab_rails['gitlab_default_can_create_group'] = true
            gitlab_rails['gitlab_username_changing_enabled'] = false
            unicorn['worker_processes'] = 2
            unicorn['worker_timeout'] = 60
            postgresql['enable'] = false
            redis['enable'] = false
            nginx['enable'] = true
            nginx['listen_port'] = 80
            nginx['listen_https'] = false
            prometheus_monitoring['enable'] = false
      volumes:
        - gitlab_config:/etc/gitlab
        - gitlab_logs:/var/log/gitlab
        - gitlab_data:/var/opt/gitlab
    - name: postgresql
      image: postgres:16-alpine
      env:
        POSTGRES_DB: ""
        POSTGRES_PASSWORD: ""
        POSTGRES_USER: ""
      volumes:
        - postgresql_data:/var/lib/postgresql/data
    - name: redis
      image: redis:7-alpine
      volumes:
        - redis_data:/data
