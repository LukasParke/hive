kind: Template
name: nextcloud
description: Self-hosted file sync and share
category: productivity
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/nextcloud.svg
image: nextcloud:stable
ports:
  - "80:80"
volumes:
  - "nextcloud-data:/var/www/html"
env: {}
domain: ""
replicas: 1
depends_on:
  - type: postgres
    version: "16"
  - type: redis
    version: "7"
