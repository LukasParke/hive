kind: Template
name: nocodb
description: NocoDB is an opensource Airtable alternative that turns any MySQL, PostgreSQL, SQL Server, SQLite & MariaDB into a smart spreadsheet.
category: databases
tags:
    - database
    - spreadsheet
    - low-code
    - nocode
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/nocodb.svg
version: latest
links:
    docs: https://docs.nocodb.com/
    github: https://github.com/nocodb/nocodb
    website: https://nocodb.com/
image: nocodb/nocodb:latest
stack: true
services:
    - name: nocodb
      image: nocodb/nocodb:latest
      env:
        NC_DB: pg://root_db:5432?u=&p=&d=
      volumes:
        - nc_data:/usr/app/data
    - name: root_db
      image: postgres:16.6
      env:
        POSTGRES_DB: ""
        POSTGRES_PASSWORD: ""
        POSTGRES_USER: ""
      volumes:
        - db_data:/var/lib/postgresql/data
