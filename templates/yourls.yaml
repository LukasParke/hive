kind: Template
name: yourls
description: YOURLS (Your Own URL Shortener) is a set of PHP scripts that will allow you to run your own URL shortening service (a la TinyURL or Bitly).
category: utilities
tags:
    - url-shortener
    - php
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/yourls.svg
version: 1.9.2
links:
    docs: https://yourls.org/#documentation
    github: https://github.com/YOURLS/YOURLS
    website: https://yourls.org/
image: yourls:1.9.2
stack: true
services:
    - name: yourls-app
      image: yourls:1.9.2
      env:
        YOURLS_DB_HOST: yourls-mysql
        YOURLS_DB_NAME: yourls
        YOURLS_DB_PASS: ""
        YOURLS_DB_USER: yourls
        YOURLS_PASS: ""
        YOURLS_SITE: https://
        YOURLS_USER: ""
      volumes:
        - yourls-data:/var/www/html
    - name: yourls-mysql
      image: mariadb:11
      env:
        MYSQL_DATABASE: yourls
        MYSQL_PASSWORD: ""
        MYSQL_ROOT_PASSWORD: ""
        MYSQL_USER: yourls
      volumes:
        - yourls-mysql-data:/var/lib/mysql
