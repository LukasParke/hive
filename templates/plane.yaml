kind: Template
name: plane
description: Easy, flexible, open source project management software
category: kanban
tags:
    - kanban
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/plane.svg
version: v0.27.1
links:
    docs: https://docs.plane.so/
    github: https://github.com/makeplane/plane
    website: https://plane.so
image: makeplane/plane-admin:v0.27.1
stack: true
services:
    - name: admin
      image: makeplane/plane-admin:v0.27.1
      command: node admin/server.js admin
    - name: api
      image: makeplane/plane-backend:v0.27.1
      volumes:
        - logs_api:/code/plane/logs
      command: ./bin/docker-entrypoint-api.sh
    - name: beat-worker
      image: makeplane/plane-backend:v0.27.1
      volumes:
        - logs_beat-worker:/code/plane/logs
      command: ./bin/docker-entrypoint-beat.sh
    - name: live
      image: makeplane/plane-live:v0.27.1
      command: node live/dist/server.js live
    - name: migrator
      image: makeplane/plane-backend:v0.27.1
      volumes:
        - logs_migrator:/code/plane/logs
      command: ./bin/docker-entrypoint-migrator.sh
    - name: plane-db
      image: postgres:17-alpine
      volumes:
        - pgdata:/var/lib/postgresql/data
      command: postgres -c 'max_connections=1000'
    - name: plane-minio
      image: minio/minio:latest
      volumes:
        - uploads:/export
      command: server /export --console-address ":9090"
    - name: plane-mq
      image: rabbitmq:3.13.6-management-alpine
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
    - name: plane-redis
      image: valkey/valkey:7.2.5-alpine
      volumes:
        - redisdata:/data
    - name: proxy
      image: makeplane/plane-proxy:v0.27.1
    - name: space
      image: makeplane/plane-space:v0.27.1
      command: node space/server.js space
    - name: web
      image: makeplane/plane-frontend:v0.27.1
      command: node web/server.js web
    - name: worker
      image: makeplane/plane-backend:v0.27.1
      volumes:
        - logs_worker:/code/plane/logs
      command: ./bin/docker-entrypoint-worker.sh
