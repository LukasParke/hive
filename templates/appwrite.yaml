kind: Template
name: appwrite
description: |-
    Appwrite is an end-to-end platform for building Web, Mobile, Native, or Backend apps, packaged as a set of Docker microservices. It includes both a backend server and a fully integrated hosting solution for deploying static and server-side rendered frontends. Appwrite abstracts the complexity and repetitiveness required to build modern apps from scratch and allows you to build secure, full-stack applications faster.
    Using Appwrite, you can easily integrate your app with user authentication and multiple sign-in methods, a database for storing and querying users and team data, storage and file management, image manipulation, Cloud Functions, messaging, and more services.
category: databases
tags:
    - database
    - firebase
    - mariadb
    - hosting
    - self-hosted
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/appwrite.svg
version: 1.8.0
links:
    docs: https://appwrite.io/docs
    github: https://github.com/appwrite/appwrite
    website: https://appwrite.io/
image: appwrite/appwrite:1.8.0
stack: true
services:
    - name: appwrite
      image: appwrite/appwrite:1.8.0
      volumes:
        - appwrite-uploads:/storage/uploads:rw
        - appwrite-imports:/storage/imports:rw
        - appwrite-cache:/storage/cache:rw
        - appwrite-config:/storage/config:rw
        - appwrite-certificates:/storage/certificates:rw
        - appwrite-functions:/storage/functions:rw
        - appwrite-sites:/storage/sites:rw
        - appwrite-builds:/storage/builds:rw
    - name: appwrite-assistant
      image: appwrite/assistant:0.8.3
    - name: appwrite-browser
      image: appwrite/browser:0.2.4
    - name: appwrite-console
      image: appwrite/console:7.4.7
    - name: appwrite-realtime
      image: appwrite/appwrite:1.8.0
    - name: appwrite-task-maintenance
      image: appwrite/appwrite:1.8.0
    - name: appwrite-task-scheduler-executions
      image: appwrite/appwrite:1.8.0
    - name: appwrite-task-scheduler-functions
      image: appwrite/appwrite:1.8.0
    - name: appwrite-task-scheduler-messages
      image: appwrite/appwrite:1.8.0
    - name: appwrite-task-stats-resources
      image: appwrite/appwrite:1.8.0
    - name: appwrite-worker-audits
      image: appwrite/appwrite:1.8.0
    - name: appwrite-worker-builds
      image: appwrite/appwrite:1.8.0
      volumes:
        - appwrite-functions:/storage/functions:rw
        - appwrite-sites:/storage/sites:rw
        - appwrite-builds:/storage/builds:rw
        - appwrite-uploads:/storage/uploads:rw
    - name: appwrite-worker-certificates
      image: appwrite/appwrite:1.8.0
      volumes:
        - appwrite-config:/storage/config:rw
        - appwrite-certificates:/storage/certificates:rw
    - name: appwrite-worker-databases
      image: appwrite/appwrite:1.8.0
    - name: appwrite-worker-deletes
      image: appwrite/appwrite:1.8.0
      volumes:
        - appwrite-uploads:/storage/uploads:rw
        - appwrite-cache:/storage/cache:rw
        - appwrite-functions:/storage/functions:rw
        - appwrite-sites:/storage/sites:rw
        - appwrite-builds:/storage/builds:rw
        - appwrite-certificates:/storage/certificates:rw
    - name: appwrite-worker-functions
      image: appwrite/appwrite:1.8.0
    - name: appwrite-worker-mails
      image: appwrite/appwrite:1.8.0
    - name: appwrite-worker-messaging
      image: appwrite/appwrite:1.8.0
      volumes:
        - appwrite-uploads:/storage/uploads:rw
    - name: appwrite-worker-migrations
      image: appwrite/appwrite:1.8.0
      volumes:
        - appwrite-imports:/storage/imports:rw
    - name: appwrite-worker-stats-resources
      image: appwrite/appwrite:1.8.0
    - name: appwrite-worker-stats-usage
      image: appwrite/appwrite:1.8.0
    - name: appwrite-worker-webhooks
      image: appwrite/appwrite:1.8.0
    - name: mariadb
      image: mariadb:10.11
      env:
        MARIADB_AUTO_UPGRADE: "1"
        MYSQL_DATABASE: ""
        MYSQL_PASSWORD: ""
        MYSQL_ROOT_PASSWORD: ""
        MYSQL_USER: ""
      volumes:
        - appwrite-mariadb:/var/lib/mysql:rw
      command: mysqld --innodb-flush-method=fsync
    - name: openruntimes-executor
      image: openruntimes/executor:0.7.22
      env:
        OPR_EXECUTOR_DOCKER_HUB_PASSWORD: $_APP_DOCKER_HUB_PASSWORD
        OPR_EXECUTOR_DOCKER_HUB_USERNAME: $_APP_DOCKER_HUB_USERNAME
        OPR_EXECUTOR_ENV: $_APP_ENV
        OPR_EXECUTOR_INACTIVE_TRESHOLD: $_APP_COMPUTE_INACTIVE_THRESHOLD
        OPR_EXECUTOR_LOGGING_CONFIG: $_APP_LOGGING_CONFIG
        OPR_EXECUTOR_MAINTENANCE_INTERVAL: $_APP_COMPUTE_MAINTENANCE_INTERVAL
        OPR_EXECUTOR_NETWORK: $_APP_COMPUTE_RUNTIMES_NETWORK
        OPR_EXECUTOR_RUNTIME_VERSIONS: v5
        OPR_EXECUTOR_RUNTIMES: $_APP_FUNCTIONS_RUNTIMES,$_APP_SITES_RUNTIMES
        OPR_EXECUTOR_SECRET: $_APP_EXECUTOR_SECRET
        OPR_EXECUTOR_STORAGE_BACKBLAZE_ACCESS_KEY: $_APP_STORAGE_BACKBLAZE_ACCESS_KEY
        OPR_EXECUTOR_STORAGE_BACKBLAZE_BUCKET: $_APP_STORAGE_BACKBLAZE_BUCKET
        OPR_EXECUTOR_STORAGE_BACKBLAZE_REGION: $_APP_STORAGE_BACKBLAZE_REGION
        OPR_EXECUTOR_STORAGE_BACKBLAZE_SECRET: $_APP_STORAGE_BACKBLAZE_SECRET
        OPR_EXECUTOR_STORAGE_DEVICE: $_APP_STORAGE_DEVICE
        OPR_EXECUTOR_STORAGE_DO_SPACES_ACCESS_KEY: $_APP_STORAGE_DO_SPACES_ACCESS_KEY
        OPR_EXECUTOR_STORAGE_DO_SPACES_BUCKET: $_APP_STORAGE_DO_SPACES_BUCKET
        OPR_EXECUTOR_STORAGE_DO_SPACES_REGION: $_APP_STORAGE_DO_SPACES_REGION
        OPR_EXECUTOR_STORAGE_DO_SPACES_SECRET: $_APP_STORAGE_DO_SPACES_SECRET
        OPR_EXECUTOR_STORAGE_LINODE_ACCESS_KEY: $_APP_STORAGE_LINODE_ACCESS_KEY
        OPR_EXECUTOR_STORAGE_LINODE_BUCKET: $_APP_STORAGE_LINODE_BUCKET
        OPR_EXECUTOR_STORAGE_LINODE_REGION: $_APP_STORAGE_LINODE_REGION
        OPR_EXECUTOR_STORAGE_LINODE_SECRET: $_APP_STORAGE_LINODE_SECRET
        OPR_EXECUTOR_STORAGE_S3_ACCESS_KEY: $_APP_STORAGE_S3_ACCESS_KEY
        OPR_EXECUTOR_STORAGE_S3_BUCKET: $_APP_STORAGE_S3_BUCKET
        OPR_EXECUTOR_STORAGE_S3_ENDPOINT: $_APP_STORAGE_S3_ENDPOINT
        OPR_EXECUTOR_STORAGE_S3_REGION: $_APP_STORAGE_S3_REGION
        OPR_EXECUTOR_STORAGE_S3_SECRET: $_APP_STORAGE_S3_SECRET
        OPR_EXECUTOR_STORAGE_WASABI_ACCESS_KEY: $_APP_STORAGE_WASABI_ACCESS_KEY
        OPR_EXECUTOR_STORAGE_WASABI_BUCKET: $_APP_STORAGE_WASABI_BUCKET
        OPR_EXECUTOR_STORAGE_WASABI_REGION: $_APP_STORAGE_WASABI_REGION
        OPR_EXECUTOR_STORAGE_WASABI_SECRET: $_APP_STORAGE_WASABI_SECRET
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - appwrite-builds:/storage/builds:rw
        - appwrite-functions:/storage/functions:rw
        - appwrite-sites:/storage/sites:rw
        - /tmp:/tmp:rw
    - name: redis
      image: redis:7.2.4-alpine
      volumes:
        - appwrite-redis:/data:rw
      command: |
        redis-server --maxmemory            512mb --maxmemory-policy     allkeys-lru --maxmemory-samples    5
