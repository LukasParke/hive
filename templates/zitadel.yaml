kind: Template
name: zitadel
description: Open-source identity and access management platform with multi-tenancy, OpenID Connect, SAML, and OAuth 2.0 support.
category: security
tags:
    - identity
    - authentication
    - authorization
    - iam
    - security
    - oauth
    - openid-connect
    - saml
    - multi-tenant
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/zitadel.svg
version: latest
links:
    docs: https://zitadel.com/docs/
    github: https://github.com/zitadel/zitadel
    website: https://zitadel.com/
image: ghcr.io/zitadel/zitadel:latest
ports:
    - "8080"
stack: true
services:
    - name: db
      image: postgres:17-alpine
      env:
        PGUSER: postgres
        POSTGRES_DB: zitadel
        POSTGRES_PASSWORD: ""
      volumes:
        - postgres_data:/var/lib/postgresql/data
    - name: zitadel
      image: ghcr.io/zitadel/zitadel:latest
      ports:
        - "8080"
      env:
        ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ""
        ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
        ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
        ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
        ZITADEL_DATABASE_POSTGRES_HOST: db
        ZITADEL_DATABASE_POSTGRES_PORT: "5432"
        ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ""
        ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
        ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
        ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
        ZITADEL_EXTERNALDOMAIN: ""
        ZITADEL_EXTERNALPORT: "8080"
        ZITADEL_EXTERNALSECURE: "false"
        ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ""
        ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: ""
        ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: ""
        ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ""
        ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ""
        ZITADEL_NOTIFICATIONS_SMTP_HOST: ""
        ZITADEL_NOTIFICATIONS_SMTP_PORT: ""
        ZITADEL_TLS_ENABLED: "false"
      volumes:
        - zitadel_data:/app/data
      command: start-from-init --masterkey "${ZITADEL_MASTERKEY}" --tlsMode disabled
