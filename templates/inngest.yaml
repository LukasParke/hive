kind: Template
name: inngest
description: Inngest is a developer platform for serverless event-driven workflows. Build reliable, scalable background functions and workflows with built-in retries, scheduling, and observability.
category: automation
tags:
    - workflow
    - automation
    - self-hosted
    - serverless
    - events
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/inngest.svg
version: v1.12.1
links:
    docs: https://www.inngest.com/docs/self-hosting
    github: https://github.com/inngest/inngest
    website: https://www.inngest.com/
image: inngest/inngest:v1.12.1
ports:
    - "8288"
stack: true
services:
    - name: inngest
      image: inngest/inngest:v1.12.1
      ports:
        - "8288"
      env:
        INNGEST_EVENT_KEY: ""
        INNGEST_HOST: 0.0.0.0
        INNGEST_JSON: "false"
        INNGEST_LOG_LEVEL: info
        INNGEST_POLL_INTERVAL: "60"
        INNGEST_PORT: "8288"
        INNGEST_POSTGRES_URI: ""
        INNGEST_QUEUE_WORKERS: "100"
        INNGEST_REDIS_URI: ""
        INNGEST_RETRY_INTERVAL: "1"
        INNGEST_SIGNING_KEY: ""
        INNGEST_TICK: "150"
        INNGEST_VERBOSE: "false"
      volumes:
        - inngest_data:/home/inngest/.inngest
      command: |
        inngest start --host 0.0.0.0 --port 8288 --event-key ${INNGEST_EVENT_KEY} --signing-key ${INNGEST_SIGNING_KEY} --postgres-uri ${INNGEST_POSTGRES_URI} --redis-uri ${INNGEST_REDIS_URI} --poll-interval ${INNGEST_POLL_INTERVAL:-60} --queue-workers ${INNGEST_QUEUE_WORKERS:-100}
    - name: postgres
      image: postgres:16-alpine
      ports:
        - "5432"
      env:
        PGUSER: ""
        POSTGRES_DB: ""
        POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
        POSTGRES_PASSWORD: ""
        POSTGRES_USER: ""
      volumes:
        - postgres_data:/var/lib/postgresql/data
    - name: redis
      image: redis:7-alpine
      ports:
        - "6379"
      volumes:
        - redis_data:/data
      command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000
