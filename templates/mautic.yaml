kind: Template
name: mautic
description: Mautic is the world's largest open-source marketing automation project. It allows you to automate the process of finding and nurturing contacts through landing pages and forms, sending email, text messages, web notifications, and tracking your contacts.
category: automation
tags:
    - marketing
    - automation
    - email
    - crm
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/mautic.svg
version: 5.1.1
links:
    docs: https://docs.mautic.org/en
    github: https://github.com/mautic/mautic
    website: https://www.mautic.org/
image: mautic/mautic:5.1.1-apache
ports:
    - "80"
stack: true
services:
    - name: mautic
      image: mautic/mautic:5.1.1-apache
      ports:
        - "80"
      env:
        DOCKER_MAUTIC_ROLE: mautic_web
        DOCKER_MAUTIC_RUN_MIGRATIONS: "true"
        MAUTIC_DB_DATABASE: ""
        MAUTIC_DB_HOST: ""
        MAUTIC_DB_PASSWORD: ""
        MAUTIC_DB_PORT: ""
        MAUTIC_DB_USER: ""
        MAUTIC_MESSENGER_DSN_EMAIL: ""
        MAUTIC_MESSENGER_DSN_HIT: ""
        MAUTIC_TRUSTED_PROXIES: ""
        MAUTIC_URL: ""
        PHP_INI_DATE_TIMEZONE: ""
        PHP_MEMORY_LIMIT: ""
      volumes:
        - mautic_data:/var/www/html
    - name: mautic-cron
      image: mautic/mautic:5.1.1-apache
      env:
        DOCKER_MAUTIC_ROLE: mautic_cron
        MAUTIC_DB_DATABASE: ""
        MAUTIC_DB_HOST: ""
        MAUTIC_DB_PASSWORD: ""
        MAUTIC_DB_PORT: ""
        MAUTIC_DB_USER: ""
        MAUTIC_URL: ""
        PHP_INI_DATE_TIMEZONE: ""
      volumes:
        - mautic_data:/var/www/html
    - name: mautic-worker
      image: mautic/mautic:5.1.1-apache
      env:
        DOCKER_MAUTIC_ROLE: mautic_worker
        DOCKER_MAUTIC_WORKERS_CONSUME_EMAIL: "2"
        DOCKER_MAUTIC_WORKERS_CONSUME_FAILED: "2"
        DOCKER_MAUTIC_WORKERS_CONSUME_HIT: "2"
        MAUTIC_DB_DATABASE: ""
        MAUTIC_DB_HOST: ""
        MAUTIC_DB_PASSWORD: ""
        MAUTIC_DB_PORT: ""
        MAUTIC_DB_USER: ""
        MAUTIC_MESSENGER_DSN_EMAIL: ""
        MAUTIC_MESSENGER_DSN_HIT: ""
        MAUTIC_URL: ""
        PHP_INI_DATE_TIMEZONE: ""
      volumes:
        - mautic_data:/var/www/html
    - name: mysql
      image: mysql:8.0
      env:
        MYSQL_DATABASE: ""
        MYSQL_PASSWORD: ""
        MYSQL_ROOT_PASSWORD: ""
        MYSQL_USER: ""
      volumes:
        - mysql_data:/var/lib/mysql
      command: --default-authentication-plugin=mysql_native_password
    - name: phpmyadmin
      image: phpmyadmin/phpmyadmin
      ports:
        - "80"
      env:
        PMA_HOST: mysql
        PMA_PORT: "3306"
        UPLOAD_LIMIT: 64M
