kind: Template
name: seaweedfs
description: SeaweedFS is a fast distributed storage system for blobs, objects, and files. Features S3-compatible API, POSIX FUSE mount, and WebDAV support.
category: storage
tags:
    - storage
    - s3
    - distributed
    - object-storage
    - file-system
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/seaweedfs.svg
version: latest
links:
    docs: https://github.com/seaweedfs/seaweedfs/wiki
    github: https://github.com/seaweedfs/seaweedfs
    website: https://seaweedfs.com/
image: chrislusf/seaweedfs:4.02
stack: true
services:
    - name: filer
      image: chrislusf/seaweedfs:4.02
      env:
        WEED_MASTER: master:9333
      volumes:
        - seaweedfs-filer:/data
      command: |
        -v=0 filer -defaultReplicaPlacement=000 -master="master:9333" -ip=filer -ip.bind=0.0.0.0 -port=8888
    - name: master
      image: chrislusf/seaweedfs:4.02
      volumes:
        - seaweedfs-master:/data/master
      command: |
        -v=0 master -volumeSizeLimitMB=10240 -ip=master -ip.bind=0.0.0.0 -port=9333 -mdir=/data/master
    - name: s3
      image: chrislusf/seaweedfs:4.02
      env:
        AWS_ACCESS_KEY_ID: ""
        AWS_SECRET_ACCESS_KEY: ""
      command: |
        -v=0 s3 -filer="filer:8888" -ip.bind=0.0.0.0 -port=8333
    - name: volume
      image: chrislusf/seaweedfs:4.02
      volumes:
        - seaweedfs-volume:/data/volume
      command: |
        -v=0 volume -mserver="master:9333" -port=8080 -dir=/data/volume -max=100
