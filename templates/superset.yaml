kind: Template
name: superset
description: Data visualization and data exploration platform.
category: analytics
tags:
    - analytics
    - bi
    - dashboard
    - database
    - sql
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/superset-unofficial.svg
version: 6.0.0
links:
    docs: https://superset.apache.org/docs/intro
    github: https://github.com/amancevice/docker-superset
    website: https://superset.apache.org
image: amancevice/superset:6.0.0
stack: true
services:
    - name: superset
      image: amancevice/superset:6.0.0
      env:
        MAPBOX_API_KEY: ""
        POSTGRES_DB: ""
        POSTGRES_HOST: superset_postgres
        POSTGRES_PASSWORD: ""
        POSTGRES_USER: ""
        REDIS_HOST: superset_redis
        REDIS_PASSWORD: ""
        SECRET_KEY: ""
    - name: superset_postgres
      image: postgres:18
      env:
        POSTGRES_DB: ""
        POSTGRES_PASSWORD: ""
        POSTGRES_USER: ""
      volumes:
        - superset_postgres_data:/var/lib/postgresql
    - name: superset_redis
      image: redis:8
      volumes:
        - superset_redis_data:/data
      command: redis-server --requirepass ${REDIS_PASSWORD}
