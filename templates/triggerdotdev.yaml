kind: Template
name: triggerdotdev
description: Trigger is a platform for building event-driven applications.
category: event-driven
tags:
    - event-driven
    - applications
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/trigger.dev.svg
version: v3
links:
    docs: https://trigger.dev/docs
    github: https://github.com/triggerdotdev/trigger.dev
    website: https://trigger.dev/
image: ghcr.io/triggerdotdev/coordinator:v3
ports:
    - "9020"
stack: true
services:
    - name: coordinator
      image: ghcr.io/triggerdotdev/coordinator:v3
      ports:
        - "9020"
      env:
        OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:3040/otel
        PLATFORM_HOST: webapp
        PLATFORM_SECRET: $COORDINATOR_SECRET
        PLATFORM_WS_PORT: "3030"
        SECURE_CONNECTION: "false"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    - name: docker-provider
      image: ghcr.io/triggerdotdev/provider/docker:v3
      ports:
        - "9020"
      env:
        OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:3040/otel
        PLATFORM_HOST: webapp
        PLATFORM_SECRET: $PROVIDER_SECRET
        PLATFORM_WS_PORT: "3030"
        SECURE_CONNECTION: "false"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    - name: electric
      image: electricsql/electric:latest
      ports:
        - "3000"
      env:
        DATABASE_URL: ?sslmode=disable
    - name: postgres
      image: postgres:16
      ports:
        - "5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data/
      command:
        - -c
        - wal_level=logical
    - name: redis
      image: redis:7
      ports:
        - "6379"
      volumes:
        - redis-data:/data
    - name: webapp
      image: ghcr.io/triggerdotdev/trigger.dev:v3
      ports:
        - "3000"
      env:
        APP_ORIGIN: http://localhost:3040
        DEV_OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:3040/otel
        ELECTRIC_ORIGIN: http://electric:3000
        LOGIN_ORIGIN: http://localhost:3040
