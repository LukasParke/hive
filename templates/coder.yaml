kind: Template
name: coder
description: Coder is an open-source cloud development environment (CDE) that you host in your cloud or on-premises.
category: self-hosted
tags:
    - self-hosted
    - open-source
    - builder
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/coder.svg
version: 2.15.3
links:
    docs: https://coder.com/docs
    github: https://github.com/coder/coder
    website: https://coder.com/
image: ghcr.io/coder/coder:v2.15.3
stack: true
services:
    - name: coder
      image: ghcr.io/coder/coder:v2.15.3
      env:
        CODER_PG_CONNECTION_URL: postgresql://:@db/?sslmode=disable
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    - name: db
      image: postgres:17
      volumes:
        - db_coder_data:/var/lib/postgresql/data
