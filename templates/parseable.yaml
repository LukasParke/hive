kind: Template
name: parseable
description: Fast observability and log analytics platform on object storage
category: monitoring
tags:
    - observability
    - logging
    - analytics
    - monitoring
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/parseable.svg
version: v1.6.5
links:
    docs: https://www.parseable.com/docs
    github: https://github.com/parseablehq/parseable
    website: https://www.parseable.com/
image: parseable/parseable:v1.6.0
ports:
    - "8000"
    - "8001"
    - "8002"
volumes:
    - parseable-staging:/parseable/staging
    - parseable-data:/parseable/data
env:
    P_ADDR: 0.0.0.0:8000
    P_FS_DIR: /parseable/data
    P_PASSWORD: ""
    P_STAGING_DIR: /parseable/staging
    P_USERNAME: ""
