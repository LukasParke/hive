kind: Template
name: instantdb
description: InstantDB is a real-time database server that provides instant data synchronization and real-time updates for applications.
category: databases
tags:
    - database
    - real-time
    - self-hosted
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/instantdb.svg
version: latest
links:
    docs: https://github.com/instantdb/instant
    github: https://github.com/instantdb/instant/tree/main/server
    website: https://github.com/instantdb/instant
image: hari1367709/instantdb-server:latest
ports:
    - "8888"
    - "6005"
stack: true
services:
    - name: postgres
      image: ghcr.io/instantdb/postgresql:postgresql-16-pg-hint-plan
      env:
        POSTGRES_DB: ""
        POSTGRES_PASSWORD: ""
        POSTGRES_USER: ""
      volumes:
        - backend-db:/var/lib/postgresql/data
      command:
        - postgres
        - -c
        - wal_level=logical
        - -c
        - max_replication_slots=4
        - -c
        - max_wal_senders=4
        - -c
        - shared_preload_libraries=pg_hint_plan
        - -c
        - random_page_cost=1.1
    - name: server
      image: hari1367709/instantdb-server:latest
      ports:
        - "8888"
        - "6005"
      env:
        AWS_ACCESS_KEY_ID: ""
        AWS_REGION: us-east-1
        AWS_SECRET_ACCESS_KEY: ""
        DATABASE_URL: postgresql://:@postgres:5432/
        HOST: 0.0.0.0
        NODE_ENV: production
        NREPL_BIND_ADDRESS: 0.0.0.0
        PORT: "8888"
        PYTHONUNBUFFERED: "1"
      command:
        - java
        - -Djava.awt.headless=true
        - -server
        - -jar
        - target/instant-standalone.jar
