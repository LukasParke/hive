kind: Template
name: tolgee
description: Developer & translator friendly web-based localization platform
category: self-hosted
tags:
    - self-hosted
    - i18n
    - localization
    - translations
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/tolgee.svg
version: latest
links:
    docs: https://tolgee.io/platform
    github: https://github.com/tolgee/tolgee-platform
    website: https://tolgee.io
image: tolgee/tolgee:latest
ports:
    - "8080"
env:
    TOLGEE_AUTHENTICATION_ENABLED: ""
    TOLGEE_AUTHENTICATION_INITIAL_PASSWORD: ""
    TOLGEE_AUTHENTICATION_INITIAL_USERNAME: ""
    TOLGEE_AUTHENTICATION_JWT_SECRET: ""
    TOLGEE_FRONT_END_URL: ""
    TOLGEE_MACHINE_TRANSLATION_GOOGLE_API_KEY: ""
    TOLGEE_SMTP_AUTH: ""
    TOLGEE_SMTP_FROM: ""
    TOLGEE_SMTP_HOST: ""
    TOLGEE_SMTP_PASSWORD: ""
    TOLGEE_SMTP_PORT: ""
    TOLGEE_SMTP_SSL_ENABLED: ""
    TOLGEE_SMTP_USERNAME: ""
