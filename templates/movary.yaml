kind: Template
name: movary
description: Movary is a self-hosted platform for tracking and managing your watched movies using TMDB.
category: media
tags:
    - media
    - movies
    - movie-tracker
    - self-hosted
    - plex
    - jellyfin
    - emby
    - kodi
    - trakt
    - letterboxd
    - netflix
    - tmdb
    - statistics
    - rating
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/movary.svg
version: latest
links:
    docs: https://docs.movary.org/
    github: https://github.com/leepeuker/movary
    website: https://movary.org/
image: leepeuker/movary:latest
ports:
    - "8080"
stack: true
services:
    - name: movary
      image: leepeuker/movary:latest
      ports:
        - "8080"
      env:
        APP_ENV: production
        APP_URL: http://localhost:8080
        DATABASE_MODE: mysql
        DATABASE_MYSQL_HOST: mysql
        DATABASE_MYSQL_NAME: movary
        DATABASE_MYSQL_PASSWORD: ""
        DATABASE_MYSQL_USER: movary_user
        TMDB_API_KEY: ""
      volumes:
        - movary_storage:/app/storage
    - name: mysql
      image: mysql:8.0
      env:
        MYSQL_DATABASE: movary
        MYSQL_INNODB_BUFFER_POOL_SIZE: 128M
        MYSQL_INNODB_LOG_FILE_SIZE: 64M
        MYSQL_PASSWORD: ""
        MYSQL_ROOT_PASSWORD: ""
        MYSQL_USER: movary_user
      volumes:
        - movary_db:/var/lib/mysql
      command: --default-authentication-plugin=mysql_native_password
