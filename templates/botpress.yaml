kind: Template
name: botpress
description: Botpress is a platform for building conversational AI agents. It provides a simple and effective solution for building conversational AI agents from anywhere.
category: ai
tags:
    - ai
    - self-hosted
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/botpress.svg
version: latest
links:
    docs: https://botpress.com/docs
    github: https://github.com/botpress/botpress
    website: https://botpress.com
image: botpress/server:12.31.9
ports:
    - "81"
stack: true
services:
    - name: botpress
      image: botpress/server:12.31.9
      ports:
        - "81"
      env:
        BP_HOST: 0.0.0.0
        NODE_ENV: production
        PG_HOST: botpress-db
        PG_PASSWORD: ""
        PG_PORT: "5432"
        PG_SSL: "false"
        PG_USER: postgres
        PORT: "80"
      volumes:
        - data:/botpress/data
    - name: botpress-db
      image: postgres:15-alpine
      env:
        POSTGRES_DB: botpress
        POSTGRES_PASSWORD: ""
        POSTGRES_USER: postgres
      volumes:
        - db_data:/var/lib/postgresql/data
