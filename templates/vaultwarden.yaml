kind: Template
name: vaultwarden
description: Lightweight Bitwarden-compatible password manager
category: security
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/vaultwarden.svg
image: vaultwarden/server:latest
ports:
  - "80:80"
volumes:
  - "vaultwarden-data:/data"
env:
  SIGNUPS_ALLOWED: "true"
domain: ""
replicas: 1
