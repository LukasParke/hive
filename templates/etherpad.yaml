kind: Template
name: etherpad
description: Etherpad is a real-time collaborative text editor that allows multiple users to edit documents simultaneously.
category: productivity
tags:
    - collaboration
    - text-editor
    - real-time
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/etherpad.svg
version: latest
links:
    docs: https://github.com/ether/etherpad-lite/wiki
    github: https://github.com/ether/etherpad-lite
    website: https://etherpad.org/
image: etherpad/etherpad:latest
stack: true
services:
    - name: app
      image: etherpad/etherpad:latest
      env:
        ADMIN_PASSWORD: ""
        DB_CHARSET: ""
        DB_HOST: ""
        DB_NAME: ""
        DB_PASS: ""
        DB_PORT: ""
        DB_TYPE: ""
        DB_USER: ""
        DEFAULT_PAD_TEXT: ""
        DISABLE_IP_LOGGING: ""
        NODE_ENV: ""
        SOFFICE: ""
        TRUST_PROXY: ""
    - name: postgres
      image: postgres:15-alpine
      env:
        PGDATA: /var/lib/postgresql/data/pgdata
        POSTGRES_DB: ""
        POSTGRES_PASSWORD: ""
        POSTGRES_USER: ""
