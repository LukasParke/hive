kind: Template
name: postiz
description: Postiz is a modern, open-source platform for managing and publishing content across multiple channels.
category: cms
tags:
    - cms
    - content-management
    - publishing
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/postiz.svg
version: latest
links:
    docs: https://docs.postiz.com
    github: https://github.com/gitroomhq/postiz
    website: https://postiz.com
image: ghcr.io/gitroomhq/postiz-app:latest
stack: true
services:
    - name: postiz-app
      image: ghcr.io/gitroomhq/postiz-app:latest
      env:
        BACKEND_INTERNAL_URL: http://localhost:3000
        DATABASE_URL: postgresql://:@postiz-postgres:5432/
        FRONTEND_URL: https://
        IS_GENERAL: "true"
        JWT_SECRET: ""
        MAIN_URL: https://
        NEXT_PUBLIC_BACKEND_URL: https:///api
        NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
        REDIS_URL: redis://postiz-redis:6379
        STORAGE_PROVIDER: local
        UPLOAD_DIRECTORY: /uploads
      volumes:
        - postiz-config:/config/
        - postiz-uploads:/uploads/
    - name: postiz-postgres
      image: postgres:17-alpine
      env:
        POSTGRES_DB: ""
        POSTGRES_PASSWORD: ""
        POSTGRES_USER: ""
      volumes:
        - postiz-postgres-data:/var/lib/postgresql/data
    - name: postiz-redis
      image: redis:7.2
      volumes:
        - postiz-redis-data:/data
