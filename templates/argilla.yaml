kind: Template
name: argilla
description: Argilla is a robust platform designed to help engineers and data scientists streamline the management of machine learning data workflows. It simplifies tasks like data labeling, annotation, and quality control.
category: machine-learning
tags:
    - machine-learning
    - data-labeling
    - ai
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/argilla.svg
version: latest
links:
    docs: https://docs.argilla.io/
    github: https://github.com/argilla-io/argilla
    website: https://www.argilla.io/
image: argilla/argilla-server:latest
ports:
    - "6900"
stack: true
services:
    - name: argilla-db
      image: postgres:15-alpine
      env:
        POSTGRES_DB: argilla
        POSTGRES_PASSWORD: ""
        POSTGRES_USER: postgres
      volumes:
        - dbdata:/var/lib/postgresql/data
    - name: argilla-elasticsearch
      image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
      env:
        ES_JAVA_OPTS: -Xms512m -Xmx512m
        cluster.name: es-argilla-local
        cluster.routing.allocation.disk.threshold_enabled: "false"
        discovery.type: single-node
        node.name: elasticsearch
        xpack.security.enabled: "false"
      volumes:
        - elasticdata:/usr/share/elasticsearch/data
    - name: argilla-redis
      image: redis:7-alpine
      env:
        REDIS_PASSWORD: ""
      volumes:
        - redisdata:/data
      command: redis-server --requirepass ${REDIS_PASSWORD}
    - name: argilla-web
      image: argilla/argilla-server:latest
      ports:
        - "6900"
      env:
        API_KEY: argilla.apikey
        ARGILLA_DATABASE_URL: postgresql+asyncpg://postgres:@argilla-db:5432/argilla
        ARGILLA_ELASTICSEARCH: http://argilla-elasticsearch:9200
        ARGILLA_HOME_PATH: /var/lib/argilla
        ARGILLA_REDIS_URL: redis://:@argilla-redis:6379/0
        PASSWORD: ""
        USERNAME: ""
        WORKSPACE: default
      volumes:
        - argilladata:/var/lib/argilla
    - name: argilla-worker
      image: argilla/argilla-server:latest
      env:
        ARGILLA_DATABASE_URL: postgresql+asyncpg://postgres:@argilla-db:5432/argilla
        ARGILLA_ELASTICSEARCH: http://argilla-elasticsearch:9200
        ARGILLA_HOME_PATH: /var/lib/argilla
        ARGILLA_REDIS_URL: redis://:@argilla-redis:6379/0
        BACKGROUND_NUM_WORKERS: "2"
      volumes:
        - argilladata:/var/lib/argilla
      command: python -m argilla_server worker --num-workers ${BACKGROUND_NUM_WORKERS}
