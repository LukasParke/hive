kind: Template
name: pastefy
description: Pastefy is an open-source pastebin with support for syntax highlighting and OAuth2 authentication.
category: productivity
tags:
    - pastebin
    - text-sharing
    - collaboration
    - oauth2
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/pastefy.svg
version: latest
links:
    docs: https://github.com/interaapps/pastefy/wiki
    github: https://github.com/interaapps/pastefy
    website: https://pastefy.app
image: mariadb:10.11
stack: true
services:
    - name: db
      image: mariadb:10.11
      env:
        MYSQL_DATABASE: ""
        MYSQL_PASSWORD: ""
        MYSQL_ROOT_PASSWORD: ""
        MYSQL_USER: ""
    - name: pastefy
      image: interaapps/pastefy:latest
      env:
        DATABASE_DRIVER: mysql
        DATABASE_HOST: db
        DATABASE_NAME: ""
        DATABASE_PASSWORD: ""
        DATABASE_PORT: "3306"
        DATABASE_USER: ""
        HTTP_SERVER_CORS: ""
        HTTP_SERVER_PORT: "80"
        OAUTH2_DISCORD_CLIENT_ID: ""
        OAUTH2_DISCORD_CLIENT_SECRET: ""
        OAUTH2_GITHUB_CLIENT_ID: ""
        OAUTH2_GITHUB_CLIENT_SECRET: ""
        OAUTH2_GOOGLE_CLIENT_ID: ""
        OAUTH2_GOOGLE_CLIENT_SECRET: ""
        OAUTH2_INTERAAPPS_CLIENT_ID: ""
        OAUTH2_INTERAAPPS_CLIENT_SECRET: ""
        OAUTH2_TWITCH_CLIENT_ID: ""
        OAUTH2_TWITCH_CLIENT_SECRET: ""
        SERVER_NAME: ""
