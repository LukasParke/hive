      security: []
  /organizations:
    get:
      operationId: listOrganizations
      summary: List organizations
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Organization list
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
      description: Retrieve organizations
