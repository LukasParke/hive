  /ws/terminal/{containerId}:
    parameters:
    - name: containerId
      in: path
      required: true
      schema:
        type: string
      description: Docker container ID.
    get:
      operationId: wsTerminal
      summary: Interactive container terminal over WebSocket
      description: |
        WebSocket endpoint (RFC 6455). The HTTP GET performs a protocol upgrade;
        after upgrading, binary frames carry terminal input from the client and
        output from the container's exec session. The connection is proxied to
        the agent running on the node that hosts the container.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: WebSocket upgrade response; stream follows.
          content:
            application/json:
              schema:
                type: object
                description: WebSocket stream.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
  /ws/logs/{containerId}:
    parameters:
    - name: containerId
      in: path
      required: true
      schema:
        type: string
      description: Docker container ID.
    - name: follow
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Keep streaming new log lines after replaying history.
    - name: tail
      in: query
      required: false
      schema:
        type: integer
        default: 200
      description: Number of recent lines to replay before streaming.
    get:
      operationId: wsContainerLogs
      summary: Stream container logs over WebSocket
      description: |
        WebSocket endpoint (RFC 6455). After the protocol upgrade, each text
        frame carries one chunk of container log output (timestamps included).
        The stream is proxied to the agent on the node hosting the container.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: WebSocket upgrade response; stream follows.
          content:
            application/json:
              schema:
                type: object
                description: WebSocket stream.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
  /metrics:
