        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Create organizations id invitations
  /organizations/{id}/invitations/{inviteId}:
    parameters:
    - $ref: '#/components/parameters/IdParam'
    - name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      operationId: deleteOrganizationInvitation
      summary: Cancel invitation
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Invitation cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Delete organizations id invitations inviteId
  /organizations/{id}/invitations/{inviteId}/resend:
    parameters:
    - $ref: '#/components/parameters/IdParam'
    - name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: resendOrganizationInvitation
      summary: Resend invitation
      security:
      - bearerAuth: []
      requestBody:
        description: Empty request body.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Invitation resent
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - token
                - email
                - status
                properties:
                  id:
                    type: string
                  token:
                    type: string
                  email:
                    type: string
                  status:
                    type: string
