version: "2"
sql:
  - schema: internal/db/migrations
    queries: internal/db/queries
    engine: postgresql
    gen:
      go:
        package: dbgen
        out: internal/db/generated
        sql_package: pgx/v5
        emit_json_tags: true
        emit_prepared_queries: true
        overrides:
          # Every JSONB column maps to json.RawMessage instead of []byte so
          # callers can unmarshal lazily without copying semantics confusion.
          - column: "applications.service_spec"
            go_type: "encoding/json.RawMessage"
          - column: "audit_log.details"
            go_type: "encoding/json.RawMessage"
          - column: "app_settings.value"
            go_type: "encoding/json.RawMessage"
          - column: "backup_destinations.config"
            go_type: "encoding/json.RawMessage"
          - column: "backup_runs.details"
            go_type: "encoding/json.RawMessage"
          - column: "request_events.payload"
            go_type: "encoding/json.RawMessage"
          - column: "security_rules.config"
            go_type: "encoding/json.RawMessage"
          - column: "swarm_cache_services.spec"
            go_type: "encoding/json.RawMessage"
          - column: "swarm_cache_services.status"
            go_type: "encoding/json.RawMessage"
          - column: "swarm_cache_tasks.spec"
            go_type: "encoding/json.RawMessage"
          - column: "swarm_cache_tasks.status"
            go_type: "encoding/json.RawMessage"
          - column: "swarm_cache_nodes.spec"
            go_type: "encoding/json.RawMessage"
          - column: "swarm_cache_nodes.status"
            go_type: "encoding/json.RawMessage"

          - column: "swarm_cache_secrets.spec"
            go_type: "encoding/json.RawMessage"
          - column: "swarm_cache_secrets.status"
            go_type: "encoding/json.RawMessage"
          - column: "swarm_cache_configs.spec"
            go_type: "encoding/json.RawMessage"
          - column: "swarm_cache_configs.status"
            go_type: "encoding/json.RawMessage"
          - column: "swarm_cache_networks.spec"
            go_type: "encoding/json.RawMessage"
          - column: "swarm_cache_networks.status"
            go_type: "encoding/json.RawMessage"
          - column: "tunnels.ingress"
            go_type: "encoding/json.RawMessage"
          - column: "tunnels.dns_records"
            go_type: "encoding/json.RawMessage"